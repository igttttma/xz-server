TTS:
  # Currently supported types are edge and doubao; adapt as needed
  EdgeTTS:
    # Define the TTS API type
    type: edge
    voice: zh-CN-XiaoxiaoNeural
    output_dir: tmp/
    # language: "Chinese"  # Output language, e.g. Chinese, English, Japanese, Korean, etc. Set it according to the languages supported by the selected voice; defaults to Chinese if omitted
  DoubaoTTS:
    # Define the TTS API type
    type: doubao
    # Volcano Engine TTS service; create an application in the Volcano Engine console first and get appid and access_token
    # Volcano Engine speech is paid; the starting price is 30 CNY for 100 concurrent requests. The free tier has only 2 concurrent requests and often reports TTS errors
    # After purchasing the service (and the free voices), it may take about half an hour before you can use it.
    # Activate regular voices here: https://console.volcengine.com/speech/service/8
    # Activate the Wanwan Xiaohe voice here: https://console.volcengine.com/speech/service/10007; after activation, set voice below to zh_female_wanwanxiaohe_moon_bigtts
    api_url: https://openspeech.bytedance.com/api/v1/tts
    voice: BV001_streaming
    output_dir: tmp/
    authorization: "Bearer;"
    appid: your Volcano Engine TTS appid
    access_token: your Volcano Engine TTS access_token
    cluster: volcano_tts
    speed_ratio: 1.0
    volume_ratio: 1.0
    pitch_ratio: 1.0
    # language: "Chinese"  # Output language, e.g. Chinese, English, Japanese, Korean, etc. Set it according to the languages supported by the selected voice; defaults to Chinese if omitted
  # Volcano TTS, supports bidirectional streaming TTS
  HuoshanDoubleStreamTTS:
    type: huoshan_double_stream
    # Visit https://console.volcengine.com/speech/service/10007 to activate the TTS large model and purchase voices
    # Get appid and access_token at the bottom of the page
    # The resource ID is fixed: volc.service_type.10029 (large-model TTS and mixing)
    # For Gizwits, change the endpoint to wss://bytedance.gizwitsapi.com/api/v3/tts/bidirection
    # Gizwits does not need appid
    ws_url: wss://openspeech.bytedance.com/api/v3/tts/bidirection
    appid: your Volcano Engine TTS appid
    access_token: your Volcano Engine TTS access_token
    resource_id: volc.service_type.10029
    speaker: zh_female_wanwanxiaohe_moon_bigtts
    # Enable WebSocket connection reuse; enabled by default (note: when reused, idle connections still consume concurrency while the device is listening)
    enable_ws_reuse: True
    # Parameter docs: https://www.volcengine.com/docs/6561/1329505
    # Audio output config (audio_params) - users can add any audio parameters supported by Volcano Engine
    audio_params:
      speech_rate: 0  # Speech rate (-50~100)
      loudness_rate: 0  # Volume (-50~100)
      # Multi-emotion voice parameters; note: only some voices currently support emotion settings.
      # Voice list: https://www.volcengine.com/docs/6561/1257544
      # emotion: "neutral"  # Emotion type (only some voices support it): neutral, happy, sad, angry, fearful, disgusted, surprised
      # emotion_scale: 4  # Emotion intensity (1~5)
    # Advanced text processing config (additions) - users can add any advanced parameters supported by Volcano Engine
    additions:
      post_process:
        pitch: 0  # Pitch (-12~12)
      # aigc_metadata: {}  # AIGC metadata config
      # cache_config: {}  # Cache config
    # Mixing control config (mix_speaker) - multi-voice mixing (TTS 1.0 only)
    # Mixing mainly applies to Doubao TTS 1.0 voices; set req_params.speaker to custom_mix_bigtts when using it
    # mix_speaker:
    #   speakers:
    #     - source_speaker: zh_male_bvlazysheep
    #       mix_factor: 0.3
    #     - source_speaker: BV120_streaming
    #       mix_factor: 0.3
    #     - source_speaker: zh_male_ahu_conversation_wvae_bigtts
    #       mix_factor: 0.4
    # language: "Chinese"  # Output language, e.g. Chinese, English, Japanese, Korean, etc. Set it according to the languages supported by the selected voice; defaults to Chinese if omitted
  # Doubao TTS model 2.0, supports bidirectional streaming TTS (based on seed-tts-2.0 resources)
